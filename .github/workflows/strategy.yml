name: Monthly Momentum Strategy - Advanced

on:
  schedule:
    - cron: "0 1 1 * *"   # 每月 1 日 09:00（UTC+8 → 01:00 UTC）
  workflow_dispatch:       # 手动触发

jobs:
  run-strategy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy matplotlib==3.7 smtplib ssl

    - name: Run Monthly Momentum Strategy
      env:
        EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        SMTP_PROVIDER: ${{ secrets.SMTP_PROVIDER }}
        RMB_CAPITAL: ${{ secrets.RMB_CAPITAL }}
        USD_RMB_RATE: ${{ secrets.USD_RMB_RATE }}
        REAL_FEE_RATE: ${{ secrets.REAL_FEE_RATE }}
        REAL_SLIPPAGE: ${{ secrets.REAL_SLIPPAGE }}
      run: |
        echo "Running monthly strategy..."
        python3 monthly_momentum_alert_advanced.py

    - name: Notify Failure on Error
      if: failure()
      run: echo "❌ Strategy run failed"
