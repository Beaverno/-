name: Monthly Momentum Alert (Advanced)

on:
  # 每月1号定时执行（UTC 01:00 = 北京时间 09:00）
  schedule:
    - cron: '0 1 1 * *'
  # 手动触发
  workflow_dispatch:

jobs:
  monthly_alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run Monthly Momentum Alert (Advanced)
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          SMTP_PROVIDER: ${{ secrets.SMTP_PROVIDER }}   # qq / 163 / gmail
          RMB_CAPITAL: ${{ secrets.RMB_CAPITAL }}       # 可选：650000
          USD_RMB_RATE: ${{ secrets.USD_RMB_RATE }}     # 可选：7.1
        run: |
          python monthly_momentum_alert_advanced.py
