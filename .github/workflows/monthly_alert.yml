name: Monthly Momentum Alert (Enhanced Momentum)

on:
  schedule:
    - cron: '0 1 1 * *'  # 每月1号 UTC+1 -> 北京时间 9:00（保留原设定）
  workflow_dispatch:    # 手动触发

jobs:
  send_alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Run monthly enhanced momentum alert
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_PROVIDER: ${{ secrets.SMTP_PROVIDER }}
          RMB_CAPITAL: ${{ secrets.RMB_CAPITAL }}   # 可选：在 Secrets 中设置 650000（字符串）
        run: |
          python monthly_momentum_alert_enhanced.py
