name: Monthly Momentum Email

on:
  schedule:
    - cron: "0 1 1 * *"   # 每月1号 01:00 运行
  workflow_dispatch:      # 手动触发

jobs:
  run-strategy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy matplotlib==3.7.0

    - name: Run strategy
      env:
        EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        SMTP_PROVIDER: ${{ secrets.SMTP_PROVIDER }}
        RMB_CAPITAL: ${{ secrets.RMB_CAPITAL }}
        USD_RMB_RATE: ${{ secrets.USD_RMB_RATE }}
      run: |
        python monthly_momentum_alert_optimized.py
