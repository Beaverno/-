name: Monthly Momentum Alert (yfinance)

on:
  schedule:
    # 每天 05:00 UTC 执行（北京时间 13:00）
    - cron: '0 5 * * 1-5'
  workflow_dispatch: # 支持手动触发

jobs:
  run_strategy:
    runs-on: ubuntu-latest
    env:
      # -------------------------
      # 邮件配置
      # -------------------------
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
      SMTP_PROVIDER: "163"

      # -------------------------
      # 策略参数
      # -------------------------
      TICKERS: "SPY,QQQ,VOO,VT,EFA,EEM,TLT,GLD"
      RISK_FREE: "SHY"
      NUM_HOLD: "3"
      FEE_RATE: "0.001"
      SLIPPAGE_BASE: "0.0005"
      MIN_TRADE_USD: "50"
      ALLOW_LIMIT_ORDERS: "True"
      LIMIT_FILL_PROB: "0.7"
      LIMIT_ADVANTAGE: "0.0002"
      TARGET_VOL: "0.10"
      MAX_LEVER: "2.0"
      SMA_WINDOW: "200"
      START_DATE: "2005-01-01"
      MONTE_CARLO_RUNS: "500"
      MONTE_CARLO_HORIZON_YEARS: "5"
      RMB_CAPITAL: "650000"
      USD_RMB_RATE: "7.1"
      OUTPUT_DIR: "./output"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib yfinance

      - name: Set END_DATE to today
        id: set_end_date
        run: echo "END_DATE=$(date +%F)" >> $GITHUB_ENV

      - name: Run monthly momentum strategy
        run: |
          python monthly_momentum_alert_yfinance.py

      - name: Upload output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: momentum_strategy_output
          path: ./output

